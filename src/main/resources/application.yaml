spring:
  application:
    name: gestobar

  datasource:
    url: jdbc:postgresql://localhost:5432/gestobar
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: gestobar

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: gestobar
    create-schemas: true

server:
  port: 8080