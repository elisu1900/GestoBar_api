spring:
  application:
    name: gestobar

  profiles:
    active: PROD

  datasource:
    url: jdbc:postgresql://localhost:5432/gestobar
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: gestobar

  flyway:
    enabled: true
    default-schema: gestobar
    create-schemas: true

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE