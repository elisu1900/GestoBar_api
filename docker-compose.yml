services:

  postgres:
    image: postgres:16
    container_name: gestobar-postgres
    environment:
      POSTGRES_DB: gestobar
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - gestobar-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gestobar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d gestobar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build: .
    container_name: gestobar-api
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gestobar
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gestobar-net

networks:
  gestobar-net:
    driver: bridge

volumes:
  gestobar-pgdata:
